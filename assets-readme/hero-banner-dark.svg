  <text class="mono" x="1150" y="158" text-anchor="middle" font-size="13" fill="#1A1A1A" letter-spacing="2">0 UI LIBS</text>
  <text class="mono" x="1150" y="178" text-anchor="middle" font-size="13" fill="#1A1A1A" letter-spacing="2">NEXT 14</text>
  <text class="mono" x="60" y="378" font-size="12" fill="#FFFDF5" letter-spacing="4">/// COMMAND PALETTE · MAGNETIC UI · CUSTOM CURSOR · DARK MODE · CASE STUDIES ///</text>
